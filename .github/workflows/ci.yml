name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@main

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@main
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  execute-test:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@main
    with:
      environments: ${{ needs.setup-build.outputs.test }}

  build-container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [toolforge-stable, toolforge-latest, upstream]
    needs: [setup-build, execute-lint, execute-test]
    permissions:
      security-events: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Build container
        uses: infrabits/ci-pack@de5274a9f89b69e94e0af3a1b3d09100997f6074 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ github.repository }}:${{ matrix.target }}-${{ github.sha }}
          use_builder: ${{ matrix.target }}
          run_safety_checks: ${{ matrix.target == 'toolforge-stable' && 'true' || 'false' }}
